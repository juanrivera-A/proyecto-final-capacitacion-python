name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    # Indicar a GitHub Actions que trabaje dentro de orders-service
    defaults:
      run:
        working-directory: ./orders-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --all-groups --no-interaction

      - name: Run Ruff (Linter & Format Check)
        run: poetry run ruff check .

      - name: Run Mypy (Type Checking)
        run: poetry run mypy src

      - name: Run Pytest
        run: poetry run pytest

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./orders-service
          file: ./orders-service/Dockerfile
          push: false
          tags: orders-service:latest
